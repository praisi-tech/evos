version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: evos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evos
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: evos-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/evos?sslmode=disable
      - PORT=8080
      - ENV=development
      - SUPABASE_JWT_SECRET=super-secret-jwt-key-change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
